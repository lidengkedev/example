<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="css,css3,cubic-bezier">
  <title>CSS3: cubic-bezier() 贝塞尔曲线动画</title>
  <style>
    .box { width: 400px; height: 400px; border: 1px solid #000; }
    .span-1 {
      display: block;
      width: 40px;
      height: 40px;
      border: 1px solid red;
      animation: center1 2s ease-in forwards;
    }
    .span-1::after{
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: greenyellow;
      animation: center2 2s ease-out forwards;
    }
    .span-2 {
      display: block;
      width: 40px;
      height: 40px;
      border: 1px solid red;
      animation: center1 2s cubic-bezier(.66,.01,1,1) forwards;
    }
    .span-2::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: greenyellow;
      animation: center2 2s cubic-bezier(0,0,.36,1) forwards;
    }
    @keyframes center1 {
      to{transform: translateX(360px)}
    }
    @keyframes center2 {
      to{transform: translateY(360px)}
    }
</style>
</head>
<body>
  <div class="box">
    <span class="span-1"></span>
  </div>
  <div class="box">
    <span class="span-2"></span>
  </div>
</body>
</html>
