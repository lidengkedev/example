<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测评 · 自主掌控者 | 外物掌控者</title>
  <style>
    /* ----- 全局重置 & 字体 ----- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #fdf6f0 0%, #f0e8e0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      margin: 0;
    }

    /* ----- 主卡片 ----- */
    .app-card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 251, 247, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 48px;
      padding: 2.8rem 3rem 3.2rem;
      box-shadow:
        0 20px 60px rgba(180, 140, 110, 0.20),
        0 8px 24px rgba(140, 100, 70, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 235, 220, 0.5);
      transition: box-shadow 0.3s ease;
    }

    @media (max-width: 600px) {
      .app-card {
        padding: 1.8rem 1.2rem 2.2rem;
        border-radius: 32px;
      }
    }

    /* ----- 标题区 ----- */
    .header {
      margin-bottom: 2.2rem;
    }

    .header h1 {
      font-size: 2.1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #3d2c1f;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.3rem 0.6rem;
    }

    .header h1 .highlight {
      background: linear-gradient(135deg, #e8835a, #d46a4a);
      padding: 0.1rem 0.8rem;
      border-radius: 60px;
      color: #fff;
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 12px rgba(216, 106, 74, 0.25);
    }

    .header p {
      margin-top: 0.7rem;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #5a4a3a;
      background: rgba(235, 215, 195, 0.35);
      padding: 0.9rem 1.4rem;
      border-radius: 28px;
      border-left: 4px solid #dbaa8a;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.6rem;
      }

      .header h1 .highlight {
        font-size: 1.3rem;
        padding: 0.05rem 0.6rem;
      }

      .header p {
        font-size: 0.95rem;
        padding: 0.7rem 1rem;
      }
    }

    /* ----- 问题列表 ----- */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin: 2rem 0 2.2rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 0.3rem;
    }

    .question-list::-webkit-scrollbar {
      width: 5px;
    }

    .question-list::-webkit-scrollbar-track {
      background: rgba(200, 175, 155, 0.15);
      border-radius: 12px;
    }

    .question-list::-webkit-scrollbar-thumb {
      background: #dbaa8a;
      border-radius: 12px;
    }

    /* ----- 单个问题卡片 ----- */
    .question-item {
      background: rgba(255, 248, 242, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 0.9rem 1.6rem 0.9rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem 0.8rem;
      border: 1px solid rgba(235, 215, 195, 0.5);
      box-shadow: 0 2px 8px rgba(160, 120, 90, 0.06);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .question-item:hover {
      background: rgba(255, 245, 235, 0.85);
      box-shadow: 0 4px 14px rgba(180, 140, 110, 0.10);
    }

    .question-item .q-text {
      font-size: 1rem;
      font-weight: 470;
      color: #3d2c1f;
      flex: 1 1 200px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .question-item .q-text .q-num {
      display: inline-block;
      min-width: 1.8rem;
      font-weight: 600;
      color: #b5836a;
      font-size: 0.9rem;
    }

    /* ----- 选项组 (圆润按钮) ----- */
    .options {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .options label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.3rem 1.1rem;
      border-radius: 60px;
      font-size: 0.92rem;
      font-weight: 500;
      color: #5a4a3a;
      background: rgba(235, 220, 208, 0.4);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      min-width: 52px;
    }

    .options label:hover {
      background: rgba(215, 190, 170, 0.35);
      transform: translateY(-1px);
    }

    .options input[type="radio"] {
      display: none;
    }

    /* 选中状态 — 是 */
    .options input[type="radio"]:checked+label {
      background: #e8835a;
      border-color: #d46a4a;
      color: #fff;
      box-shadow: 0 4px 12px rgba(216, 106, 74, 0.30);
      transform: translateY(-1px);
    }

    .options input[type="radio"]:checked+label .emoji {
      filter: brightness(1) invert(0);
    }

    /* 选中状态 — 否 */
    .options input[type="radio"]:checked+label.no-checked {
      background: #8fa8b0;
      border-color: #708a92;
      color: #fff;
      box-shadow: 0 4px 12px rgba(112, 138, 146, 0.30);
      transform: translateY(-1px);
    }

    /* 实际我们通过JS控制class，但这里用css选择器+相邻兄弟也能做，但为了更干净，我们用JS动态加类。
           但petite-vue绑定value，我们无法直接控制label的class，所以我们用另一种方式：直接用label包裹input，用:has? 兼容性不好。
           改用：每个选项用div包裹，用v-bind:class绑定。但petite-vue不支持复杂表达式? 我们改用最直接的方式：用两个label分别绑定点击事件? 但radio原生就支持。
           最稳妥：用两个label，每个里面放radio+文字，用CSS兄弟选择器。
           但petite-vue的v-model绑定value，我们可以用:class绑定item.checked === 'on' 等。
           重写一下选项结构。
        */

    /* 我们重新设计选项结构：用两个独立的label，每个包含radio和文字，利用radio的checked伪类+兄弟选择器 */
    /* 但radio的checked伪类只能作用于同级的后续兄弟，所以结构要调整 */
    /* 更简单：直接用label包裹input，然后label的样式基于input:checked + label */
    /* 但这里input和label是兄弟关系，所以用 input:checked + label 即可 */

    /* 我们重构选项html结构，使用兄弟选择器 */

    .options {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .option-wrap {
      display: flex;
      align-items: center;
      position: relative;
    }

    .option-wrap input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
    }

    .option-wrap label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.3rem 1.1rem;
      border-radius: 60px;
      font-size: 0.92rem;
      font-weight: 500;
      color: #5a4a3a;
      background: rgba(235, 220, 208, 0.4);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      min-width: 52px;
      line-height: 1.4;
    }

    .option-wrap label:hover {
      background: rgba(215, 190, 170, 0.35);
      transform: translateY(-1px);
    }

    /* 选中「是」 */
    .option-wrap input[type="radio"]:checked+label.yes-label {
      background: #e8835a;
      border-color: #d46a4a;
      color: #fff;
      box-shadow: 0 4px 12px rgba(216, 106, 74, 0.30);
      transform: translateY(-1px);
    }

    /* 选中「否」 */
    .option-wrap input[type="radio"]:checked+label.no-label {
      background: #8fa8b0;
      border-color: #708a92;
      color: #fff;
      box-shadow: 0 4px 12px rgba(112, 138, 146, 0.30);
      transform: translateY(-1px);
    }

    .option-wrap label .emoji {
      font-size: 1rem;
      line-height: 1;
      opacity: 0.7;
    }

    .option-wrap input[type="radio"]:checked+label .emoji {
      opacity: 1;
    }

    /* ----- 底部：按钮 + 结果 ----- */
    .footer-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      margin-top: 0.6rem;
    }

    .btn-result {
      background: linear-gradient(135deg, #e8835a, #d46a4a);
      border: none;
      padding: 0.9rem 3.6rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px rgba(216, 106, 74, 0.30);
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
      width: 100%;
      max-width: 340px;
    }

    .btn-result:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 32px rgba(216, 106, 74, 0.40);
      background: linear-gradient(135deg, #f08a62, #d46a4a);
    }

    .btn-result:active:not(:disabled) {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(216, 106, 74, 0.25);
    }

    .btn-result:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 4px 12px rgba(180, 140, 110, 0.12);
      filter: grayscale(0.2);
    }

    .result-box {
      font-size: 1.6rem;
      font-weight: 620;
      text-align: center;
      padding: 0.6rem 1.8rem;
      border-radius: 60px;
      background: rgba(255, 248, 242, 0.6);
      backdrop-filter: blur(4px);
      border: 1.5px solid rgba(235, 215, 195, 0.5);
      color: #3d2c1f;
      min-height: 4.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.6);
      line-height: 1.4;
      transition: all 0.3s ease;
    }

    .result-box .result-emoji {
      margin-right: 0.5rem;
      font-size: 1.8rem;
    }

    @media (max-width: 600px) {
      .result-box {
        font-size: 1.25rem;
        padding: 0.5rem 1rem;
        min-height: 3.6rem;
      }

      .btn-result {
        font-size: 1rem;
        padding: 0.75rem 2rem;
        max-width: 100%;
      }

      .question-item {
        padding: 0.7rem 1rem 0.7rem 1.2rem;
        border-radius: 20px;
      }

      .option-wrap label {
        padding: 0.2rem 0.8rem;
        font-size: 0.82rem;
        min-width: 44px;
      }

      .question-item .q-text {
        font-size: 0.92rem;
      }
    }

    /* 小装饰 */
    .badge {
      display: inline-block;
      background: rgba(232, 131, 90, 0.12);
      color: #d46a4a;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.1rem 0.6rem;
      border-radius: 40px;
      letter-spacing: 0.02em;
      margin-left: 0.3rem;
    }

    /* 进度提示 */
    .progress-hint {
      font-size: 0.85rem;
      color: #8a7a6a;
      text-align: center;
      margin-top: 0.2rem;
      letter-spacing: 0.01em;
    }

    .progress-hint span {
      font-weight: 600;
      color: #d46a4a;
    }
  </style>
</head>

<body>

  <div class="app-card" v-scope>
    <!-- 标题 -->
    <div class="header">
      <h1>
        🧭 你是
        <span class="highlight">自主掌控者</span>
        还是
        <span class="highlight" style="background:linear-gradient(135deg,#7fa8b0,#5f8890);">外物掌控者</span>
        ？
      </h1>
      <p>
        ⚡ 快速测一测 · 性格光谱上的你偏向哪一端？
        <span style="display:inline-block;margin-left:0.4rem;font-weight:400;color:#7a6a5a;">共 {{ questions.length }}
          题</span>
      </p>
    </div>

    <!-- 问题列表 -->
    <div class="question-list">
      <div v-for="(item, index) in questions" :key="index" class="question-item">
        <span class="q-text">
          <span class="q-num">{{ index + 1 }}.</span>
          {{ item.question }}
        </span>
        <div class="options">
          <!-- 是 -->
          <span class="option-wrap">
            <input :id="'yes-' + index" type="radio" :name="'q-' + index" :value="'on'" v-model="item.checked" />
            <label :for="'yes-' + index" class="yes-label">
              <span class="emoji">✅</span> 是
            </label>
          </span>
          <!-- 否 -->
          <span class="option-wrap">
            <input :id="'no-' + index" type="radio" :name="'q-' + index" :value="'off'" v-model="item.checked" />
            <label :for="'no-' + index" class="no-label">
              <span class="emoji">✖</span> 否
            </label>
          </span>
        </div>
      </div>
    </div>

    <!-- 进度提示 -->
    <div class="progress-hint" v-if="!isDisabled">
      ✅ 全部答完，点击下方查看结果
    </div>
    <div class="progress-hint" v-else>
      已答 <span>{{ answeredCount }}</span> / {{ questions.length }}
    </div>

    <!-- 底部 -->
    <div class="footer-actions">
      <button class="btn-result" :disabled="isDisabled" @click="handleResult">
        🧘 查看结果
      </button>

      <div class="result-box" v-if="result">
        <span class="result-emoji" v-if="result.includes('自主')">🌟</span>
        <span class="result-emoji" v-else-if="result.includes('外物')">🌀</span>
        <span class="result-emoji" v-else>⚖️</span>
        {{ result }}
      </div>
      <div class="result-box" v-else style="opacity:0.4;font-weight:400;font-size:1rem;color:#8a7a6a;">
        <span style="opacity:0.5;">👆 完成所有题目后，结果将出现在这里</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { createApp } from 'https://unpkg.com/petite-vue?module'

    const questions = [
      { checked: '', type: 'WAIWU', question: '对生活的态度：是否活在当下，不考虑未来？' },
      { checked: '', type: 'WAIWU', question: '对生活的态度：是否思考外在的解决方案？' },
      { checked: '', type: 'WAIWU', question: '对生活的态度：是否期望别人来改善一切“其他人怎样可以让一切变好呢？”？' },
      { checked: '', type: 'WAIWU', question: '对生活的态度：是否先行动后思考？' },
      { checked: '', type: 'WAIWU', question: '对生活的态度：是否低估困难？' },
      { checked: '', type: 'WAIWU', question: '对待问题的回应：是否对一切正在进行的事都会做出反应？' },
      { checked: '', type: 'WAIWU', question: '对待问题的回应：是否把问题看作他人的错？' },
      { checked: '', type: 'WAIWU', question: '对待问题的回应：是否埋怨所处的环境？' },
      { checked: '', type: 'WAIWU', question: '对待问题的回应：是否让他人也陷入麻烦？' },
      { checked: '', type: 'WAIWU', question: '对待问题的回应：是否否认或逃避现实？' },
      { checked: '', type: 'WAIWU', question: '心理学类型：是否冲动而且以自我为中心？' },
      { checked: '', type: 'WAIWU', question: '心理学类型：是否思想情感难以控制？' },
      { checked: '', type: 'WAIWU', question: '心理学类型：是否容易生气？' },
      { checked: '', type: 'WAIWU', question: '心理学类型：是否对内心世界不感兴趣？' },
      { checked: '', type: 'WAIWU', question: '与人关系的特点：是否期望别人提供帮助？' },
      { checked: '', type: 'WAIWU', question: '与人关系的特点：是否认为别人应该做出改变来改善环境？' },
      { checked: '', type: 'WAIWU', question: '与人关系的特点：是否期望别人聆听自己，并且常常自言自语？' },
      { checked: '', type: 'WAIWU', question: '与人关系的特点：是否要求别人不要“唠叨”？' },
      { checked: '', type: 'ZIWO', question: '对生活的态度：是否担忧未来？' },
      { checked: '', type: 'ZIWO', question: '对生活的态度：是否从内心世界出发寻找解决方案？' },
      { checked: '', type: 'ZIWO', question: '对生活的态度：是否很体贴，很有同理心：“我怎样做才可以让事情变好？”？' },
      { checked: '', type: 'ZIWO', question: '对生活的态度：是否常思考未来将会发生什么？' },
      { checked: '', type: 'ZIWO', question: '对生活的态度：是否高估困难？' },
      { checked: '', type: 'ZIWO', question: '对待问题的回应：是否试图明白正在发生的事情？' },
      { checked: '', type: 'ZIWO', question: '对待问题的回应：是否出问题会从自身找原因：“我做错过什么？”？' },
      { checked: '', type: 'ZIWO', question: '对待问题的回应：是否常常自我反思并且很负责？' },
      { checked: '', type: 'ZIWO', question: '对待问题的回应：是否独立地把问题理清并试图解决它们？' },
      { checked: '', type: 'ZIWO', question: '对待问题的回应：是否接受现实本身的样子并且愿意改变？' },
      { checked: '', type: 'ZIWO', question: '心理学类型：是否三思而后行？' },
      { checked: '', type: 'ZIWO', question: '心理学类型：是否思想情感可以控制？' },
      { checked: '', type: 'ZIWO', question: '心理学类型：是否容易感到自己有罪？' },
      { checked: '', type: 'ZIWO', question: '心理学类型：是否认为内心世界很迷人？' },
      { checked: '', type: 'ZIWO', question: '与人关系的特点：是否首先考虑他人的需求？' },
      { checked: '', type: 'ZIWO', question: '与人关系的特点：是否会考虑做出改变来改善环境？' },
      { checked: '', type: 'ZIWO', question: '与人关系的特点：是否想要帮助别人理解问题的来源？' },
      { checked: '', type: 'ZIWO', question: '与人关系的特点：是否会就一个问题与人进行讨论？' },
    ]

    createApp({
      questions,

      result: '',

      get isDisabled() {
        return this.questions.some(item => item.checked === '')
      },

      get answeredCount() {
        return this.questions.filter(item => item.checked !== '').length
      },

      handleResult() {
        const waiwu = this.questions.filter(item =>
          item.type === 'WAIWU' && item.checked === 'on'
        ).length

        const ziwo = this.questions.filter(item =>
          item.type === 'ZIWO' && item.checked === 'on'
        ).length

        if (waiwu > ziwo) {
          this.result = '您是一位 🌊 外物掌控者 · 倾向向外寻求答案'
        } else if (waiwu < ziwo) {
          this.result = '您是一位 🌟 自主掌控者 · 倾向向内探索反思'
        } else {
          this.result = '您兼具两者特质 · 内外平衡的智慧型'
        }
      }
    }).mount()
  </script>

</body>

</html>
