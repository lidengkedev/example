<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基于 Web Speech API 的浏览器语音转文本工具，需在 HTTPS 或 localhost 环境下运行。">
    <title>语音转文本</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #eef2f9;
            --card: #ffffff;
            --panel: #f6f8fc;
            --text: #1c2331;
            --muted: #7b8494;
            --border: #e2e8f2;
            --primary: #4f6ef7;
            --primary-hover: #3f5ce0;
            --danger: #e5484d;
            --danger-hover: #cf3b40;
            --shadow: 0 12px 40px rgba(31, 45, 82, .10);
            --radius: 18px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1319;
                --card: #171c25;
                --panel: #131820;
                --text: #e7ecf5;
                --muted: #8b94a6;
                --border: #272f3c;
                --shadow: 0 12px 40px rgba(0, 0, 0, .45);
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 20% 0%, rgba(79, 110, 247, .14), transparent 55%),
                radial-gradient(circle at 90% 100%, rgba(120, 90, 247, .12), transparent 50%);
            background-attachment: fixed;
        }

        .card {
            width: min(720px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 22px;
            letter-spacing: .3px;
        }

        .subtitle {
            margin: 0 0 20px;
            font-size: 13px;
            color: var(--muted);
        }

        /* ---------- 状态栏 ---------- */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
            min-height: 20px;
        }

        .dot {
            flex: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #b9c0cd;
            transition: background .2s ease;
        }

        .dot.listening {
            background: #22c55e;
            animation: pulse 1.5s ease-out infinite;
        }

        .dot.error {
            background: var(--danger);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, .55);
            }

            100% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }
        }

        /* ---------- 结果区 ---------- */
        .result {
            min-height: 180px;
            max-height: 45vh;
            overflow-y: auto;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--panel);
            font-size: 16px;
            line-height: 1.85;
            white-space: pre-wrap;
            word-break: break-word;
            scroll-behavior: smooth;
        }

        .placeholder {
            color: var(--muted);
            font-size: 15px;
        }

        .interim {
            color: var(--muted);
        }

        /* ---------- 按钮 ---------- */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            font: inherit;
            font-size: 15px;
            padding: 12px 22px;
            border-radius: 12px;
            border: 1px solid transparent;
            cursor: pointer;
            user-select: none;
            transition: transform .15s ease, background-color .2s ease,
                border-color .2s ease, box-shadow .2s ease;
        }

        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        button:active:not(:disabled) {
            transform: scale(.97);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-primary {
            flex: 1 1 auto;
            min-width: 170px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(79, 110, 247, .30);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-primary.recording {
            background: var(--danger);
            box-shadow: 0 6px 16px rgba(229, 72, 77, .30);
        }

        .btn-primary.recording:hover:not(:disabled) {
            background: var(--danger-hover);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }

        .btn-ghost:hover:not(:disabled) {
            background: var(--panel);
        }

        /* ---------- 底部信息 ---------- */
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--muted);
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translate(-50%, 16px);
            max-width: 86vw;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(20, 24, 33, .92);
            color: #fff;
            font-size: 14px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
            z-index: 99;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }

            .btn-ghost {
                flex: 1 1 0;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>语音转文本</h1>
        <p class="subtitle">基于浏览器 Web Speech API · 需在 HTTPS 或 localhost 环境下运行</p>

        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">待机中</span>
        </div>

        <div class="result" id="result" aria-live="polite">
            <span class="placeholder" id="placeholder">点击下方「开始语音输入」，识别结果会实时显示在这里…</span><span id="finalText"></span><span class="interim" id="interimText"></span>
        </div>

        <div class="actions">
            <button id="toggleBtn" class="btn-primary">开始语音输入</button>
            <button id="copyBtn" class="btn-ghost">复制</button>
            <button id="clearBtn" class="btn-ghost">清空</button>
        </div>

        <div class="meta">
            <span id="counter">0 字</span>
            <span>首次使用需授权麦克风权限</span>
        </div>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script>
        (function () {
            'use strict';

            /* ---------------- 元素引用 ---------------- */
            const toggleBtn = document.getElementById('toggleBtn');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resultEl = document.getElementById('result');
            const finalEl = document.getElementById('finalText');
            const interimEl = document.getElementById('interimText');
            const placeholderEl = document.getElementById('placeholder');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const counterEl = document.getElementById('counter');
            const toastEl = document.getElementById('toast');

            /* ---------------- 小工具 ---------------- */
            let toastTimer = null;
            function toast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
            }

            /* ---------------- 环境检测 ---------------- */
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                toggleBtn.disabled = true;
                copyBtn.disabled = true;
                clearBtn.disabled = true;
                placeholderEl.textContent = '当前浏览器不支持语音识别，请使用最新版 Chrome、Edge 或 Safari。';
                statusText.textContent = '不支持 Web Speech API';
                statusDot.classList.add('error');
                return;
            }

            if (!window.isSecureContext) {
                statusText.textContent = '当前不是安全环境，麦克风可能无法使用（需 HTTPS 或 localhost）';
                statusDot.classList.add('error');
            }

            /* ---------------- 初始化识别器 ---------------- */
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;      // 连续识别
            recognition.interimResults = true;  // 输出临时结果
            recognition.maxAlternatives = 1;

            /* ---------------- 状态 ---------------- */
            let listening = false;   // 用户期望的聆听状态
            let finalText = '';      // 已确认文本
            let interimText = '';    // 临时文本
            let lastError = '';      // 最近一次致命错误

            const FATAL_ERRORS = ['not-allowed', 'service-not-allowed', 'audio-capture', 'network'];
            const ERROR_TEXT = {
                'not-allowed': '麦克风权限被拒绝，请在浏览器地址栏允许麦克风访问',
                'service-not-allowed': '当前环境不允许使用语音识别服务',
                'audio-capture': '未检测到可用的麦克风设备',
                'network': '网络异常，无法连接语音识别服务',
                'language-not-supported': '当前语言不受支持'
            };

            /* ---------------- 渲染 ---------------- */
            function render() {
                finalEl.textContent = finalText;
                interimEl.textContent = interimText;

                const empty = !finalText && !interimText;
                placeholderEl.style.display = empty ? '' : 'none';

                counterEl.textContent = finalText.replace(/\s/g, '').length + ' 字';

                // 自动滚动到底部
                resultEl.scrollTop = resultEl.scrollHeight;
            }

            function setStatus(state, message) {
                statusDot.classList.toggle('listening', state === 'listening');
                statusDot.classList.toggle('error', state === 'error');
                statusText.textContent = message;
            }

            function setIdleUI() {
                toggleBtn.textContent = '开始语音输入';
                toggleBtn.classList.remove('recording');
            }

            function setListeningUI() {
                toggleBtn.textContent = '停止语音输入';
                toggleBtn.classList.add('recording');
                setStatus('listening', '正在聆听…');
            }

            /* ---------------- 识别事件 ---------------- */
            recognition.onstart = function () {
                setStatus('listening', '正在聆听…');
            };

            recognition.onresult = function (event) {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const res = event.results[i];
                    const text = res[0].transcript;
                    if (res.isFinal) {
                        finalText += text;
                    } else {
                        interim += text;
                    }
                }
                interimText = interim;
                render();
            };

            recognition.onerror = function (event) {
                // aborted：主动 stop 引起；no-speech：静音超时，会自动重启
                if (event.error === 'aborted' || event.error === 'no-speech') return;

                const msg = ERROR_TEXT[event.error] || ('识别出错：' + event.error);

                if (FATAL_ERRORS.indexOf(event.error) !== -1) {
                    listening = false;
                    lastError = msg;
                }
                toast(msg);
            };

            recognition.onend = function () {
                if (listening) {
                    // 浏览器因静音等原因自动结束 → 自动重启，保持连续识别
                    setTimeout(function () {
                        if (!listening) return;
                        try {
                            recognition.start();
                        } catch (err) {
                            /* 已经在运行中，忽略 */
                        }
                    }, 250);
                    return;
                }

                setIdleUI();
                if (lastError) {
                    setStatus('error', lastError);
                } else {
                    setStatus('idle', '待机中');
                }
            };

            /* ---------------- 开始 / 停止 ---------------- */
            function startListening() {
                lastError = '';
                listening = true;
                interimText = '';
                render();
                setListeningUI();
                try {
                    recognition.start();
                } catch (err) {
                    /* start() 在已启动时会抛错，忽略 */
                }
            }

            function stopListening() {
                listening = false;
                setIdleUI();
                setStatus('idle', '待机中');
                try {
                    recognition.stop();
                } catch (err) {
                    /* 忽略 */
                }
                interimText = '';
                render();
            }

            toggleBtn.addEventListener('click', function () {
                if (listening) {
                    stopListening();
                } else {
                    startListening();
                }
            });

            /* ---------------- 复制 ---------------- */
            copyBtn.addEventListener('click', function () {
                const text = (finalText + interimText).trim();
                if (!text) {
                    toast('暂无内容可复制');
                    return;
                }

                function fallbackCopy() {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '-1000px';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy');
                        toast('已复制到剪贴板');
                    } catch (e) {
                        toast('复制失败，请手动选择文本');
                    }
                    document.body.removeChild(ta);
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(
                        function () { toast('已复制到剪贴板'); },
                        fallbackCopy
                    );
                } else {
                    fallbackCopy();
                }
            });

            /* ---------------- 清空 ---------------- */
            clearBtn.addEventListener('click', function () {
                finalText = '';
                interimText = '';
                render();
                toast('已清空');
            });

            /* ---------------- 页面卸载时释放 ---------------- */
            window.addEventListener('beforeunload', function () {
                listening = false;
                try { recognition.abort(); } catch (err) { /* 忽略 */ }
            });

            /* ---------------- 初始渲染 ---------------- */
            render();
        })();
    </script>
</body>

</html>
