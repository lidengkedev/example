<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆环占比</title>
  <style>
    .donut-chart {
      position: relative;
      width: 200px;
      height: 200px;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .chart-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .text-top {
      font-size: 16px;
      color: #333;
    }

    .text-bottom {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
   <div class="donut-chart">
    <svg viewBox="0 0 100 100">
      <!-- 背景圆环 -->
      <circle 
        cx="50" 
        cy="50" 
        r="40" 
        fill="none" 
        stroke="#52ccba" 
        stroke-width="8" 
      />
      <!-- 数据占比圆环 -->
      <circle 
        cx="50" 
        cy="50" 
        r="40" 
        fill="none" 
        stroke="#409eff" 
        stroke-width="8" 
        stroke-dasharray="251.2" 
        stroke-dashoffset="173.83" 
        transform="rotate(-90 50 50)"
      />
      <!-- 分隔线 -->
      <circle 
        cx="50" 
        cy="50" 
        r="40" 
        fill="none" 
        stroke="green" 
        stroke-width="2" 
        stroke-dasharray="2.512 248.688" 
        transform="rotate(-90 50 50)"
      />
    </svg>
    <div class="chart-content">
      <div class="text-top">需拆迁</div>
      <div class="text-bottom">75项</div>
    </div>
  </div>
</body>
</html>
